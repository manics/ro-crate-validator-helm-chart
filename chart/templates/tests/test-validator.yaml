---
apiVersion: v1
kind: ConfigMap
metadata:
  name: "{{ include "ro-crate-validator.fullname" . }}-test-validator"
  labels:
    {{- include "ro-crate-validator.labels" . | nindent 4 }}
    app.kubernetes.io/component: test
  annotations:
    "helm.sh/hook": test
data:
  dummy.json: |
    {
      "crate_json": "{\"test1\":\"test2\"}"
    }

---
apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "ro-crate-validator.fullname" . }}-test-validator"
  labels:
    {{- include "ro-crate-validator.labels" . | nindent 4 }}
    app.kubernetes.io/component: test
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: curl
      image: docker.io/alpine/curl:latest
      command:
        - curl
      args:
        - -f
        - -v
        - --max-time
        - "60"
        - http://{{ include "ro-crate-validator.fullname" . }}:{{ .Values.service.port }}/v1/ro_crates/validate_metadata
        - -H
        - 'accept: application/json'
        - -H
        - 'Content-Type: application/json'
        - --data-binary
        - "@/data/dummy.json"
      volumeMounts:
        - name: data
          mountPath: /data
  volumes:
    - name: data
      configMap:
        name: "{{ include "ro-crate-validator.fullname" . }}-test-validator"
  restartPolicy: Never
